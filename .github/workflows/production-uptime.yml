name: Production Uptime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-uptime.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  check-cv-builder:
    name: Check public CV builder
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public CV builder
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 --output "$body" --write-out '%{http_code}' https://cv.inspireambitions.com/)"
          if [[ "$status" != "200" ]]; then
            echo "CV Builder returned HTTP $status"
            exit 1
          fi
          if ! grep -q "InspireAmbitions CV Builder" "$body"; then
            echo "CV Builder response did not contain the expected page title"
            exit 1
          fi

  check-download-gate:
    name: Check download gate integration
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check download gate integration
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 --output "$body" --write-out '%{http_code}' https://cv.inspireambitions.com/api/subscribe)"
          if [[ "$status" != "200" ]]; then
            echo "Download gate health check returned HTTP $status"
            cat "$body"
            exit 1
          fi
          if ! grep -q '"ok":true' "$body"; then
            echo "Download gate health response did not report ok=true"
            cat "$body"
            exit 1
          fi
