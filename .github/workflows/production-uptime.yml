name: Production Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  check-cv-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public CV builder
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --location --retry 2 --retry-all-errors --max-time 25 --output "$body" --write-out '%{http_code}' https://cv.inspireambitions.com/)"
          test "$status" = "200"
          grep -q "InspireAmbitions CV Builder" "$body"

      - name: Check legacy CV redirects
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            /dubai-cv-builder/ \
            /ai-powered-cv-builder/ \
            /bn/dubai-cv-builder/ \
            /bn/ai-powered-cv-builder/
          do
            target="$(curl --silent --show-error --head --max-time 20 --output /dev/null --write-out '%{redirect_url}' "https://inspireambitions.com${path}")"
            test "$target" = "https://cv.inspireambitions.com/"
          done
