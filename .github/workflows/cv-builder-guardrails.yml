name: CV Builder Guardrails

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:free
      - run: npx playwright install --with-deps chromium
      - name: Pin Lighthouse to Playwright Chromium
        run: |
          CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm run check:perf
      - run: npm run test:e2e
      - run: npm run test:lighthouse
